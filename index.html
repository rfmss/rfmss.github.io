  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: #1a1a1a;
      font-family: Georgia, 'Times New Roman', serif;
      padding: 48px 24px;
      transition: background-color 0.4s ease;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 40px;
      letter-spacing: -1px;
    }

    /* ── two-column layout ── */
    .grid {
      display: -webkit-flex;
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .section {
      -webkit-flex: 1;
      flex: 1;
      background: var(--card);
      border-radius: 12px;
      padding: 24px;
    }

    .section-title {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #555;
      margin-bottom: 2px;
    }

    .link-item {
      display: block;
      padding: 12px 0;
      border-bottom: 1px solid rgba(0,0,0,0.07);
      text-decoration: none;
      color: #1a1a1a;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
    }

    .link-item:first-of-type { padding-top: 0; }
    .link-item:last-of-type  { border-bottom: none; padding-bottom: 0; }

    .link-inner {
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-align-items: center;
      align-items: center;
    }

    .link-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: #555;
      letter-spacing: 0.05em;
      display: block;
      margin-top: 2px;
    }

    .link-arrow svg {
      display: block;
      color: #555;
    }

    /* ── palette switcher ── */
    .palette-strip {
      display: -webkit-flex;
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
    }

    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .swatch:active { transform: scale(0.88); }
    .swatch.active { border-color: #1a1a1a; }

    @media (max-width: 480px) {
      .grid { -webkit-flex-direction: column; flex-direction: column; }
      h1 { font-size: 2.2rem; }
    }
  </style>

  <script>
    // Paleta Anthropic — warm muted tones
    var PALETTES = [
      { bg: '#b2c9c3', card: '#f4efe6' }, // sage (default)
      { bg: '#c9bfb0', card: '#f5f0e8' }, // warm sand
      { bg: '#b8c4ce', card: '#eef2f5' }, // mist blue
      { bg: '#c4bac9', card: '#f2eef5' }, // soft lavender
      { bg: '#c9c4b0', card: '#f5f2e8' }, // warm stone
      { bg: '#b8c9b8', card: '#eef5ee' }, // deeper sage
      { bg: '#cec0b4', card: '#f5ede8' }, // warm clay
    ];

    var KEY = 'rfmss_palette';

    function applyPalette(idx, save) {
      var p = PALETTES[idx];
      document.body.style.backgroundColor = p.bg;
      document.documentElement.style.setProperty('--card', p.card);
      document.querySelectorAll('.section').forEach(function(s) {
        s.style.backgroundColor = p.card;
      });
      document.querySelectorAll('.swatch').forEach(function(sw, i) {
        sw.classList.toggle('active', i === idx);
      });
      if (save) localStorage.setItem(KEY, idx);
    }

    function buildSwatches() {
      var strip = document.getElementById('palette-strip');
      PALETTES.forEach(function(p, i) {
        var sw = document.createElement('div');
        sw.className = 'swatch';
        sw.style.backgroundColor = p.bg;
        sw.style.border = '2px solid rgba(0,0,0,0.15)';
        sw.addEventListener('click', function() { applyPalette(i, true); });
        strip.appendChild(sw);
      });
    }

    buildSwatches();

    // Load saved or pick random on first visit
    var saved = localStorage.getItem(KEY);
    if (saved !== null && PALETTES[+saved]) {
      applyPalette(+saved, false);
    } else {
      var rand = Math.floor(Math.random() * PALETTES.length);
      applyPalette(rand, true);
    }
  </script>
