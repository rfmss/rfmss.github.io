    :root {

      --font-mono: 'Courier New', Courier, monospace;

    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: var(--font-mono);
      background-color: var(--dark-bg);
      color: var(--text-main);

        linear-gradient(90deg, rgba(204, 122, 0, 0.03) 1px, transparent 1px),

      background-attachment: fixed;

      padding: 20px;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    /* RTL Support */
    body.rtl { direction: rtl; text-align: right; }
    body.rtl .lang-switch { right: auto; left: 20px; }
    body.rtl h2 { border-left: none; border-right: 3px solid var(--amber); padding-left: 0; padding-right: 15px; }

    .glass-panel {
      position: relative;
      max-width: 720px;
      width: 100%;
      background: rgba(8, 4, 1, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 50px 40px;
      border-radius: 8px;
      box-shadow:
        0 0 0 1px rgba(0,0,0, 0.8),
        0 20px 50px rgba(0,0,0, 0.95);
      overflow: hidden;
    }

    .border-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: visible;
    }

    .border-rect {
      fill: none;
      stroke: url(#amberGradient);
      stroke-width: 2;
      rx: 8px;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 4px rgba(204, 122, 0, 0.6));
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
    }

    /* LANG SWITCH */
    .lang-switch {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    .lang-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      opacity: 0.3;
      filter: grayscale(100%);
      cursor: pointer;
      transition: 0.3s;
      padding: 0;
      line-height: 1;
    }

    .lang-btn:hover, .lang-btn.active {
      opacity: 1;
      filter: grayscale(0%);
      transform: scale(1.2);
    }

    /* A11y focus */
    .lang-btn:focus-visible,
    .btn:focus-visible,
    .social-link:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 3px;
      border-radius: 4px;
    }

    h1 {
      font-size: 2.8rem;
      margin: 0 0 10px 0;
      color: #fff;
      letter-spacing: -2px;
      text-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    h2 {
      font-size: 1.1rem;
      color: var(--amber);
      margin-top: 40px;
      margin-bottom: 20px;
      border-left: 3px solid var(--amber);
      padding-left: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .role {
      color: var(--amber);
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
      text-shadow: 0 0 5px var(--amber-glow);
    }

    .sub-role {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: #888;
    }

    p {
      font-family: var(--font-sans);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 20px;
      color: #ccc;
    }

    strong { color: #fff; }

    .highlight-box {
      background: rgba(204, 122, 0, 0.05);
      padding: 20px;
      border-left: 2px solid var(--amber);
      font-family: var(--font-mono);
      color: #e0e0e0;
      margin: 30px 0;
      font-style: italic;
    }

    .project-card {
      border: 1px solid #333;
      background: rgba(0,0,0,0.4);
      padding: 25px;
      margin-bottom: 40px;
      transition: border-color 0.3s;
    }

    .project-card:hover { border-color: var(--amber); }

    .project-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
      margin-bottom: 15px;
      gap: 10px;
    }

    .project-title {
      font-weight: bold;
      color: #fff;
      font-size: 1.2rem;
    }

    .status-badge {
      font-size: 0.7rem;
      background: #111;
      color: var(--amber);
      border: 1px solid var(--amber);
      padding: 4px 8px;
      border-radius: 2px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .btn {
      display: inline-block;
      background: var(--amber);
      color: #000;
      padding: 12px 24px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 15px;
      font-size: 0.9rem;
      transition: all 0.2s;
      border: 1px solid var(--amber);
    }

    .btn:hover {
      background: transparent;
      color: var(--amber);
      box-shadow: 0 0 15px var(--amber-glow);
    }

    .btn-outline {
      background: transparent;
      color: #fff;
      border: 1px solid #444;
      margin-left: 10px;
    }

    .btn-outline:hover {
      border-color: #fff;
      background: rgba(255,255,255,0.05);
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .social-link {
      background: rgba(0,0,0,0.3);
      border: 1px solid #333;
      padding: 15px;
      text-decoration: none;
      color: #888;
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
    }

    .social-link:hover {
      border-color: var(--amber);
      background: rgba(204, 122, 0, 0.05);
      color: #fff;
    }

    .social-link span {
      text-transform: uppercase;
      font-size: 0.7rem;
      font-weight: bold;
      color: var(--amber);
      margin-bottom: 5px;
    }

    footer {
      margin-top: 60px;
      border-top: 1px solid #333;
      padding-top: 20px;
      text-align: center;
      font-size: 0.75rem;
      color: #555;
      letter-spacing: 2px;
    }

    @media (max-width: 600px) {
      .glass-panel { padding: 30px 20px; }
      h1 { font-size: 2.2rem; }
      .project-header { flex-direction: column; align-items: flex-start; }
      .btn-outline { margin-left: 0; margin-top: 10px; display: block; text-align: center; }
      .btn { display: block; text-align: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      .lang-btn:hover, .lang-btn.active { transform: none; }
      .border-rect { filter: none; }
      animateTransform { display: none; }
    }

</head>

    const LANG_META = {
      pt: { htmlLang: "pt-BR", dir: "ltr" },
      en: { htmlLang: "en-GB", dir: "ltr" },
      es: { htmlLang: "es", dir: "ltr" },
      fr: { htmlLang: "fr", dir: "ltr" },
      ar: { htmlLang: "ar", dir: "rtl" }
    };

    const DEFAULT_LANG = "pt";
    const STORAGE_KEY = "rfmss_lang";

    function setDocLang(lang) {
      const meta = LANG_META[lang] || LANG_META[DEFAULT_LANG];
      document.documentElement.setAttribute("lang", meta.htmlLang);
      document.documentElement.setAttribute("dir", meta.dir);

      if (meta.dir === "rtl") document.body.classList.add("rtl");
      else document.body.classList.remove("rtl");
    }

    function applyI18n(lang) {
      const dict = I18N[lang] || I18N[DEFAULT_LANG];

      // Title
      if (dict.meta_title) document.title = dict.meta_title;

      // Safe text nodes
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (key && dict[key] != null) el.textContent = dict[key];
      });

      // HTML nodes (explicit only)
      document.querySelectorAll("[data-i18n-html]").forEach(el => {
        const key = el.getAttribute("data-i18n-html");
        if (key && dict[key] != null) el.innerHTML = dict[key];
      });

      // Active button
      document.querySelectorAll(".lang-btn").forEach(btn => btn.classList.remove("active"));
      const activeBtn = document.getElementById("btn-" + lang);
      if (activeBtn) activeBtn.classList.add("active");

      setDocLang(lang);
    }

    function setLang(lang) {
      const safeLang = I18N[lang] ? lang : DEFAULT_LANG;
      localStorage.setItem(STORAGE_KEY, safeLang);
      applyI18n(safeLang);
    }

    function initLang() {
      const saved = localStorage.getItem(STORAGE_KEY);
      const lang = saved && I18N[saved] ? saved : DEFAULT_LANG;
      applyI18n(lang);
    }

    // Events
    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => setLang(btn.dataset.lang));
    });

    initLang();
  </script>
