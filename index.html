<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rfmss</title>
  <style>
    :root {
      --amber: #cc7a00;
      --dark-bg: #080401;
      --font-mono: 'Courier New', Courier, monospace;
      --font-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: var(--font-mono);
      background-color: var(--dark-bg);
      color: #d4d4d4;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      max-width: 480px;
      width: 100%;
    }

    h1 {
      font-size: 2.4rem;
      margin: 0 0 30px 0;
      color: #fff;
      letter-spacing: -2px;
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .social-link {
      background: rgba(0,0,0,0.3);
      border: 1px solid #333;
      padding: 14px;
      text-decoration: none;
      color: #888;
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
    }

    .social-link:hover {
      border-color: var(--amber);
      background: rgba(204, 122, 0, 0.05);
      color: #fff;
    }

    .social-link span {
      text-transform: uppercase;
      font-size: 0.7rem;
      font-weight: bold;
      color: var(--amber);
      margin-bottom: 4px;
    }

    .social-link:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>rfmss</h1>

    <div class="social-grid">
      <a href="https://bsky.app/profile/rfmss.github.io" class="social-link" target="_blank" rel="noopener noreferrer">
        <span>Bluesky</span>
        <div>@rfmss.github.io</div>
      </a>

      <a href="https://wandering.shop/@rafa" class="social-link" target="_blank" rel="me noopener noreferrer">
        <span>Mastodon</span>
        <div>@rafa@wandering.shop</div>
      </a>

      <a href="https://hachyderm.io/@rfmss" class="social-link" target="_blank" rel="me noopener noreferrer">
        <span>Mastodon</span>
        <div>@rfmss@hachyderm.io</div>
      </a>

      <a href="https://sh.itjust.works/u/rfmss" class="social-link" target="_blank" rel="noopener noreferrer">
        <span>Lemmy</span>
        <div>sh.itjust.works/u/rfmss</div>
      </a>

      <a href="https://github.com/rfmss" class="social-link" target="_blank" rel="noopener noreferrer">
        <span>GitHub</span>
        <div>github.com/rfmss</div>
      </a>

      <a href="mailto:rfmss@disr.it" class="social-link">
        <span>Email</span>
        <div>rfmss@disr.it</div>
      </a>
    </div>
  </main>
</body>
</html>
