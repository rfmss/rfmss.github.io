<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rfmss</title>
  <style>
    :root {
      --bg: #b2c9c3;
      --card-bg: #f4efe6;
      --text: #1a1a1a;
      --text-muted: #555;
      --font-serif: Georgia, 'Times New Roman', serif;
      --font-mono: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-serif);
      padding: 60px 24px;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 48px;
      letter-spacing: -1px;
    }

    .section {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 16px;
    }

    .link-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .link-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid rgba(0,0,0,0.07);
      text-decoration: none;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      transition: opacity 0.15s;
    }

    .link-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .link-item:first-child {
      padding-top: 0;
    }

    .link-item:hover { opacity: 0.55; }

    .link-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .link-arrow {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .section-title {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>rfmss</h1>

    <div class="section">
      <p class="section-title">redes</p>
      <div class="link-list">
        <a href="https://bsky.app/profile/rfmss.github.io" class="link-item" target="_blank" rel="noopener noreferrer">
          <span>Bluesky <span class="link-label">@rfmss.github.io</span></span>
          <span class="link-arrow">↗</span>
        </a>
        <a href="https://wandering.shop/@rafa" class="link-item" target="_blank" rel="me noopener noreferrer">
          <span>Mastodon <span class="link-label">@rafa@wandering.shop</span></span>
          <span class="link-arrow">↗</span>
        </a>
        <a href="https://hachyderm.io/@rfmss" class="link-item" target="_blank" rel="me noopener noreferrer">
          <span>Mastodon <span class="link-label">@rfmss@hachyderm.io</span></span>
          <span class="link-arrow">↗</span>
        </a>
        <a href="https://sh.itjust.works/u/rfmss" class="link-item" target="_blank" rel="noopener noreferrer">
          <span>Lemmy <span class="link-label">sh.itjust.works/u/rfmss</span></span>
          <span class="link-arrow">↗</span>
        </a>
        <a href="https://github.com/rfmss" class="link-item" target="_blank" rel="noopener noreferrer">
          <span>GitHub <span class="link-label">github.com/rfmss</span></span>
          <span class="link-arrow">↗</span>
        </a>
        <a href="mailto:rfmss@disr.it" class="link-item">
          <span>Email <span class="link-label">rfmss@disr.it</span></span>
          <span class="link-arrow">↗</span>
        </a>
      </div>
    </div>

    <div class="section">
      <p class="section-title">projetos</p>
      <div class="link-list">
        <a href="https://rfmss.github.io/eskrev" class="link-item" target="_blank" rel="noopener noreferrer">
          <span>eskrev</span>
          <span class="link-arrow">↗</span>
        </a>
        <a href="https://rfmss.github.io/bijuled" class="link-item" target="_blank" rel="noopener noreferrer">
          <span>bijuled</span>
          <span class="link-arrow">↗</span>
        </a>
        <a href="https://rfmss.github.io/FernandaTowers" class="link-item" target="_blank" rel="noopener noreferrer">
          <span>FernandaTowers</span>

        </a>

          <span>p</span>
          <span class="link-arrow">↗</span>
        </a>
        <a href="https://rfmss.github.io/dirlizanu" class="link-item" target="_blank" rel="noopener noreferrer">
          <span>dirlizanu</span>
          <span class="link-arrow">↗</span>
        </a>
        <a href="https://rfmss.github.io/nota" class="link-item" target="_blank" rel="noopener noreferrer">
          <span>nota</span>
          <span class="link-arrow">↗</span>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
