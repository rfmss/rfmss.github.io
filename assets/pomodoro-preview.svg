      <text x="24" y="32" fill="#087da9" font-family="Courier New, monospace" font-size="9" font-weight="700" letter-spacing="1.5">SESSÃO LIVRE</text>
      <text x="22" y="131" fill="#161817" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" letter-spacing="-6">25:00</text>
      <text x="25" y="157" fill="#161817" fill-opacity=".62" font-family="Courier New, monospace" font-size="9" font-weight="700" letter-spacing="2">PRONTO</text>

      <g transform="translate(242 35)">
        <circle cx="48" cy="54" r="48" fill="#ff5a19" stroke="#161817" stroke-width="5"/>
        <path d="M48 13c-9-12-19-14-29-12 8 5 11 11 12 18-6-4-12-5-20-3 9 7 18 10 29 10h16c11 0 20-3 29-10-8-2-14-1-20 3 1-7 4-13 12-18-10-2-20 0-29 12Z" fill="#161817"/>
        <text x="48" y="64" text-anchor="middle" fill="#fff8f1" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">25</text>
        <text x="48" y="80" text-anchor="middle" fill="#fff8f1" font-family="Courier New, monospace" font-size="7" font-weight="700" letter-spacing="1.4">MIN</text>
        <g transform="translate(0 118)">
          <rect x="0" y="0" width="8" height="7" fill="#ff5a19"/><rect x="10" y="0" width="8" height="7" fill="#ff5a19"/><rect x="20" y="0" width="8" height="7" fill="#ff5a19"/><rect x="30" y="0" width="8" height="7" fill="#ff5a19"/>
          <rect x="40" y="0" width="8" height="7" fill="none" stroke="#161817" stroke-opacity=".35"/><rect x="50" y="0" width="8" height="7" fill="none" stroke="#161817" stroke-opacity=".35"/><rect x="60" y="0" width="8" height="7" fill="none" stroke="#161817" stroke-opacity=".35"/><rect x="70" y="0" width="8" height="7" fill="none" stroke="#161817" stroke-opacity=".35"/><rect x="80" y="0" width="8" height="7" fill="none" stroke="#161817" stroke-opacity=".35"/><rect x="90" y="0" width="8" height="7" fill="none" stroke="#161817" stroke-opacity=".35"/>
        </g>
      </g>
