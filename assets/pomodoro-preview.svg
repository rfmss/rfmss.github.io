<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Pomodoro RafaMass Blueprint</title>
  <desc id="desc">Prévia do Pomodoro com relógio 25:00, selo de tomate e comandos técnicos.</desc>
  <defs>
    <pattern id="stage-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#86c7df" stroke-opacity=".1"/>
    </pattern>
    <pattern id="paper-dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#161817" fill-opacity=".08"/>
    </pattern>
    <pattern id="blue-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#36a7d2" stroke-opacity=".18"/>
    </pattern>
  </defs>

  <rect width="512" height="512" fill="#0f1113"/>
  <rect width="512" height="512" fill="url(#stage-grid)"/>
  <rect x="18" y="18" width="476" height="476" fill="none" stroke="#86c7df" stroke-opacity=".2"/>

  <g transform="translate(50 42)">
    <rect x="9" y="11" width="412" height="420" rx="22" fill="#000" opacity=".42"/>
    <rect width="412" height="420" rx="22" fill="#f3eee4" stroke="#36a7d2" stroke-width="3"/>
    <rect width="412" height="420" rx="22" fill="url(#paper-dots)"/>
    <rect x="10" y="10" width="392" height="400" rx="15" fill="none" stroke="#36a7d2" stroke-opacity=".34"/>

    <text x="28" y="34" fill="#087da9" font-family="Courier New, monospace" font-size="9" font-weight="700" letter-spacing="2">POMODORO // APARATO TEMPORAL</text>
    <text x="28" y="61" fill="#161817" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800">FOCO MEDIDO.</text>

    <g transform="translate(26 82)">
      <rect width="360" height="33" fill="#d8f0f8" stroke="#36a7d2" stroke-opacity=".65"/>
      <rect x="3" y="3" width="175" height="27" fill="#f3eee4"/>
      <text x="90" y="21" text-anchor="middle" fill="#161817" font-family="Courier New, monospace" font-size="8" font-weight="700">TIMER LIVRE</text>
      <text x="270" y="21" text-anchor="middle" fill="#161817" fill-opacity=".55" font-family="Courier New, monospace" font-size="8" font-weight="700">CICLO POMODORO</text>
