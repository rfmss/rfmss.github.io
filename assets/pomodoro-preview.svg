<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Pomodoro RafaMass Blueprint</title>
  <desc id="desc">Prévia do Pomodoro com relógio 25:00 e módulo lateral de progresso com selo de tomate.</desc>
  <defs>
    <pattern id="stage-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#86c7df" stroke-opacity=".1"/>
    </pattern>
    <pattern id="paper-dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#161817" fill-opacity=".08"/>
    </pattern>
    <pattern id="blue-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#36a7d2" stroke-opacity=".18"/>
    </pattern>
  </defs>

  <rect width="512" height="512" fill="#0f1113"/>
  <rect width="512" height="512" fill="url(#stage-grid)"/>
  <rect x="18" y="18" width="476" height="476" fill="none" stroke="#86c7df" stroke-opacity=".2"/>

  <g transform="translate(50 42)">
    <rect x="9" y="11" width="412" height="420" rx="22" fill="#000" opacity=".42"/>
    <rect width="412" height="420" rx="22" fill="#f3eee4" stroke="#36a7d2" stroke-width="3"/>
    <rect width="412" height="420" rx="22" fill="url(#paper-dots)"/>
    <rect x="10" y="10" width="392" height="400" rx="15" fill="none" stroke="#36a7d2" stroke-opacity=".34"/>

    <text x="28" y="34" fill="#087da9" font-family="Courier New, monospace" font-size="9" font-weight="700" letter-spacing="2">POMODORO // APARATO TEMPORAL</text>
    <text x="28" y="61" fill="#161817" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800">FOCO MEDIDO.</text>

    <g transform="translate(26 82)">
      <rect width="360" height="33" fill="#d8f0f8" stroke="#36a7d2" stroke-opacity=".65"/>
      <rect x="3" y="3" width="175" height="27" fill="#f3eee4"/>
      <text x="90" y="21" text-anchor="middle" fill="#161817" font-family="Courier New, monospace" font-size="8" font-weight="700">TIMER LIVRE</text>
      <text x="270" y="21" text-anchor="middle" fill="#161817" fill-opacity=".55" font-family="Courier New, monospace" font-size="8" font-weight="700">CICLO POMODORO</text>
    </g>

    <g transform="translate(26 130)">
      <rect width="360" height="210" fill="#f3eee4" stroke="#161817" stroke-width="3"/>
      <rect width="360" height="210" fill="url(#blue-grid)"/>

      <g>
        <rect width="226" height="210" fill="#f3eee4" fill-opacity=".5"/>
        <text x="22" y="34" fill="#087da9" font-family="Courier New, monospace" font-size="9" font-weight="700" letter-spacing="1.5">FOCO</text>
        <text x="20" y="126" fill="#161817" font-family="Arial, Helvetica, sans-serif" font-size="71" font-weight="800" letter-spacing="-6">25:00</text>
        <text x="23" y="153" fill="#161817" fill-opacity=".62" font-family="Courier New, monospace" font-size="9" font-weight="700" letter-spacing="2">PRONTO</text>
        <line x1="22" y1="180" x2="166" y2="180" stroke="#161817" stroke-width="2"/>
        <text x="22" y="196" fill="#161817" fill-opacity=".56" font-family="Courier New, monospace" font-size="6.5" font-weight="700" letter-spacing="1">TEMPO RESTANTE</text>
      </g>

      <g transform="translate(226 0)">
        <rect width="134" height="210" fill="#d8f0f8" stroke="#161817" stroke-width="2"/>
        <text x="12" y="18" fill="#161817" font-family="Courier New, monospace" font-size="6.5" font-weight="700" letter-spacing="1">MARCADOR</text>
        <text x="122" y="18" text-anchor="end" fill="#087da9" font-family="Courier New, monospace" font-size="6.5" font-weight="700">10 ETAPAS</text>
        <line x1="12" y1="27" x2="122" y2="27" stroke="#161817" stroke-opacity=".35"/>
        <rect x="18" y="39" width="98" height="108" fill="#f3eee4" fill-opacity=".65" stroke="#161817" stroke-opacity=".5"/>
        <rect x="23" y="44" width="98" height="108" fill="#161817" opacity=".18"/>
        <rect x="31" y="48" width="72" height="88" rx="12" fill="#ff5a19" stroke="#cf3d0a" stroke-width="5"/>
        <path d="M67 58c-7-9-14-10-21-9 6 4 8 8 9 13-5-3-9-4-15-2 7 5 13 7 21 7h12c8 0 14-2 21-7-6-2-10-1-15 2 1-5 3-9 9-13-7-1-14 0-21 9Z" fill="#161817"/>
        <text x="67" y="101" text-anchor="middle" fill="#fff8f1" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">25</text>
        <text x="67" y="116" text-anchor="middle" fill="#fff8f1" font-family="Courier New, monospace" font-size="6" font-weight="700">MIN</text>
        <text x="12" y="166" fill="#161817" fill-opacity=".6" font-family="Courier New, monospace" font-size="6" font-weight="700">PROGRESSO</text>
        <g transform="translate(12 176)">
          <rect width="8" height="7" fill="#ff5a19"/><rect x="10" width="8" height="7" fill="#ff5a19"/><rect x="20" width="8" height="7" fill="#ff5a19"/><rect x="30" width="8" height="7" fill="#ff5a19"/>
          <rect x="40" width="8" height="7" fill="#f3eee4" stroke="#161817" stroke-opacity=".35"/><rect x="50" width="8" height="7" fill="#f3eee4" stroke="#161817" stroke-opacity=".35"/><rect x="60" width="8" height="7" fill="#f3eee4" stroke="#161817" stroke-opacity=".35"/><rect x="70" width="8" height="7" fill="#f3eee4" stroke="#161817" stroke-opacity=".35"/><rect x="80" width="8" height="7" fill="#f3eee4" stroke="#161817" stroke-opacity=".35"/><rect x="90" width="8" height="7" fill="#f3eee4" stroke="#161817" stroke-opacity=".35"/>
        </g>
      </g>
    </g>

    <g transform="translate(26 354)" font-family="Courier New, monospace" font-size="7" font-weight="700" text-anchor="middle">
      <rect width="112" height="40" fill="#f3eee4" stroke="#161817"/><rect x="124" width="112" height="40" fill="#161817" stroke="#161817"/><rect x="248" width="112" height="40" fill="#f3eee4" stroke="#161817"/>
      <text x="56" y="24" fill="#161817">REINICIAR</text><text x="180" y="24" fill="#f3eee4">INICIAR</text><text x="304" y="24" fill="#161817">ENCERRAR</text>
    </g>

    <text x="28" y="408" fill="#161817" fill-opacity=".58" font-family="Courier New, monospace" font-size="7" font-weight="700" letter-spacing="1">RELÓGIO ABSOLUTO · SESSÃO PERSISTENTE · OFFLINE</text>
  </g>
</svg>
