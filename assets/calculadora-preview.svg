        <rect y="116" width="74" height="46" rx="9"/><rect x="86" y="116" width="74" height="46" rx="9"/><rect x="172" y="116" width="74" height="46" rx="9"/><rect x="258" y="116" width="74" height="46" rx="9" fill="#d8f0f8"/>
