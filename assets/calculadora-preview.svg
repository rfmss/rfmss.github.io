<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Calculadora RafaMass Blueprint</title>
  <desc id="desc">Prévia da calculadora com visor amplo, teclas claras e operadores em cyan.</desc>
  <defs>
