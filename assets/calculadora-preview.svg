    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#161817" fill-opacity=".075"/></pattern>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf8f1"/><stop offset="1" stop-color="#e5dccd"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0f1113"/><rect width="512" height="512" fill="url(#stage)"/><rect x="18" y="18" width="476" height="476" fill="none" stroke="#86c7df" stroke-opacity=".2"/>
  <g transform="translate(68 34)">
